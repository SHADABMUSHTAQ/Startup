worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # The Forensic Upload Block (50MB Limit for large forensic bundles)
    client_max_body_size 50M;

    # Enterprise NAT Rate Limiting: High volume to support corporate firewall IPs
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;

    # Production Logs
    access_log /var/log/nginx/warsoc_access.log;
    error_log /var/log/nginx/warsoc_error.log;

    # Upstream pointing natively to localhost Uvicorn binds
    upstream warsoc_api {
        zone warsoc_api 64k;
        server warsoc-api:8000;
    }

    # HTTP server block: Redirects all non-ACME challenge traffic to HTTPS
    server {
        listen 80;
        server_name _; # Replace with actual domain name during setup (e.g. warsoc.company.com)

        # Let's Encrypt/Certbot ACME Challenge location block
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            try_files $uri =404;
        }

        # Global redirect to secure port 443
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block: Production TLS edge termination
    server {
        listen 443 ssl;
        http2 on;
        server_name _; # Replace with actual domain name during setup (e.g. warsoc.company.com)

        # SSL Configuration - Managed dynamically by Certbot in production
        # During initial run, self-signed or pre-generated paths can be placed here:
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # Premium Cryptographic Profile (Strong Modern Security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!SHA:!AES128-SHA;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Premium Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;" always;

        # Backend gateway only. The React app is deployed separately.
        location / {
            return 404;
        }

        # Route API to FastAPI Uvicorn
        location /api/ {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://warsoc_api/api/;
            
            # Forward headers correctly to satisfy proxy expectations
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for forensic stream ingest responsiveness
            proxy_buffering off;
        }

        # Route WebSocket to FastAPI Uvicorn (For Live Threat Feeds)
        location /ws {
            proxy_pass http://warsoc_api/ws;
            
            # Keepalive upgrade headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Upgrade configurations
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Robust Keepalive window (1 Hour) to prevent edge timeouts on quiet connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
