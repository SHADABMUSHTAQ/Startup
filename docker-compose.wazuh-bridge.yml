x-warsoc-bridge-security: &warsoc-bridge-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  warsoc-wazuh-bridge-init:
    build:
      context: .
      dockerfile: Dockerfile.wazuh-bridge
    image: warsoc-wazuh-bridge:${WAZUH_BRIDGE_IMAGE_TAG:-local}
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - install -d -o 1000 -g 1000 -m 0700 /var/lib/warsoc-wazuh
    user: "0:0"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - warsoc_wazuh_bridge_spool:/var/lib/warsoc-wazuh

  warsoc-wazuh-bridge:
    <<: *warsoc-bridge-security
    build:
      context: .
      dockerfile: Dockerfile.wazuh-bridge
    image: warsoc-wazuh-bridge:${WAZUH_BRIDGE_IMAGE_TAG:-local}
    container_name: warsoc-wazuh-bridge
    entrypoint: []
    command:
      - uvicorn
      - app.wazuh_integration.bridge_runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --ssl-keyfile
      - /run/warsoc-wazuh-tls/compute-b-server.key
      - --ssl-certfile
      - /run/warsoc-wazuh-tls/compute-b-server.crt
      - --ssl-ca-certs
      - /run/warsoc-wazuh-tls/compute-a-ca.crt
      - --ssl-cert-reqs
      - "2"
    restart: unless-stopped
    env_file:
      - ${WAZUH_BRIDGE_ENV_FILE:-.env.wazuh-bridge}
    environment:
      WAZUH_BRIDGE_ENABLED: "true"
      WAZUH_BRIDGE_SPOOL_PATH: /var/lib/warsoc-wazuh/bridge.sqlite3
      WAZUH_ALERTS_JSON_PATH: /var/ossec/logs/alerts/alerts.json
      WAZUH_RULE_REGISTRY_PATH: /etc/warsoc-wazuh/rule-registry.json
      WAZUH_BRIDGE_MANAGER_HOST: wazuh.manager
      WAZUH_BRIDGE_MANAGER_PORT: "15140"
    ports:
      - "${WAZUH_BRIDGE_BIND_IP:-127.0.0.1}:${WAZUH_BRIDGE_PORT:-9443}:8020"
    volumes:
      - warsoc_wazuh_bridge_spool:/var/lib/warsoc-wazuh
      - wazuh_alerts:/var/ossec/logs:ro
      - ${WAZUH_RULE_REGISTRY_FILE:-./deploy/wazuh/registry/warsoc-lab-canary-v1.json}:/etc/warsoc-wazuh/rule-registry.json:ro
      - ${WAZUH_BRIDGE_TLS_DIR:-./keys/wazuh-bridge}:/run/warsoc-wazuh-tls:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      warsoc-wazuh-bridge-init:
        condition: service_completed_successfully
    networks:
      wazuh_private:
        ipv4_address: ${WAZUH_BRIDGE_CONTAINER_IP:?WAZUH_BRIDGE_CONTAINER_IP is required}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 128

volumes:
  warsoc_wazuh_bridge_spool:
  wazuh_alerts:
    external: true
    name: ${WAZUH_ALERTS_VOLUME:?WAZUH_ALERTS_VOLUME is required}

networks:
  wazuh_private:
    external: true
    name: ${WAZUH_DOCKER_NETWORK:?WAZUH_DOCKER_NETWORK is required}
