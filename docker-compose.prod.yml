x-warsoc-logging: &warsoc-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-warsoc-process-security: &warsoc-process-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  warsoc-api:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-api-prod
    restart: always
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      TRUSTED_PROXY_HOSTS: 172.28.0.10,127.0.0.1,::1,localhost
      REPORTS_DIR: /app/data/reports
      AGENT_CDN_URL: ${AGENT_CDN_URL:?AGENT_CDN_URL required}
      SALES_EMAIL: ${SALES_EMAIL:?SALES_EMAIL required}
      AGENT_EVENT_SIGNATURE_MODE: ${AGENT_EVENT_SIGNATURE_MODE:-required}
      INGEST_PLATFORM_DAILY_BYTES_MAX: ${INGEST_PLATFORM_DAILY_BYTES_MAX:-3221225472}
      ENABLE_MANUAL_LOG_INJECTION: ${ENABLE_MANUAL_LOG_INJECTION:-false}
    volumes:
      - reports_data_prod:/app/data/reports
      - uploads_data_prod:/app/uploaded_files
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      warsoc-internal:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Lifespan permits up to 45s for schema startup plus bounded cache
      # hydration. Do not fail the deployment before that window completes.
      start_period: 75s
    # Notice: NO PORTS EXPOSED. Traffic must route through Nginx.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 512M

  unified-worker:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-unified-worker-prod
    command: python -m app.workers.unified_worker
    restart: always
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      DB_NAME: ${MONGODB_DB_NAME:?MONGODB_DB_NAME required}
      CONSUMER_NAME: unified_worker_prod_1
      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.com}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-587}
      ZOHO_SMTP_USER: ${ZOHO_SMTP_USER:?ZOHO_SMTP_USER required}
      ZOHO_SMTP_PASS: ${ZOHO_SMTP_PASS:?ZOHO_SMTP_PASS required}
      ENABLE_SECURITY_ALERT_EMAILS: ${ENABLE_SECURITY_ALERT_EMAILS:-false}
      AGENT_EVENT_SIGNATURE_MODE: ${AGENT_EVENT_SIGNATURE_MODE:-required}
      ENABLE_MANUAL_LOG_INJECTION: ${ENABLE_MANUAL_LOG_INJECTION:-false}
    volumes:
      - ./keys:/app/keys:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      warsoc-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M
          pids: 256

  threat-hunter:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-threat-hunter-prod
    profiles: ["legacy-detection"]
    command: python -m app.workers.detection_worker
    restart: always
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      warsoc-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 256

  compliance-cron:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-compliance-cron-prod
    command: python -m app.workers.compliance_cron
    restart: always
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      REPORTS_DIR: /app/data/reports
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - reports_data_prod:/app/data/reports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 256

  storage-archiver:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-storage-archiver-prod
    command: python -m app.workers.storage_archiver
    restart: on-failure
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:?MONGODB_DB_NAME required}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?AZURE_STORAGE_CONNECTION_STRING required}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-warsoc-cold-storage}
      AZURE_STORAGE_CONTAINER_SIEM: ${AZURE_STORAGE_CONTAINER_SIEM:-}
      AZURE_STORAGE_CONTAINER_PECA: ${AZURE_STORAGE_CONTAINER_PECA:-}
      AZURE_STORAGE_CONTAINER_FBR: ${AZURE_STORAGE_CONTAINER_FBR:-}
      AZURE_STORAGE_CONTAINER_GENERAL: ${AZURE_STORAGE_CONTAINER_GENERAL:-}
      AZURE_IMMUTABILITY_REQUIRED: ${AZURE_IMMUTABILITY_REQUIRED:-true}
      AZURE_IMMUTABILITY_SCOPE: ${AZURE_IMMUTABILITY_SCOPE:-blob}
      AZURE_CONTAINER_IMMUTABILITY_LOCKED: ${AZURE_CONTAINER_IMMUTABILITY_LOCKED:-false}
      AZURE_CONTAINER_IMMUTABILITY_DAYS: ${AZURE_CONTAINER_IMMUTABILITY_DAYS:-0}
      AZURE_CONTAINER_IMMUTABILITY_LOCKED_SIEM: ${AZURE_CONTAINER_IMMUTABILITY_LOCKED_SIEM:-}
      AZURE_CONTAINER_IMMUTABILITY_DAYS_SIEM: ${AZURE_CONTAINER_IMMUTABILITY_DAYS_SIEM:-}
      AZURE_CONTAINER_IMMUTABILITY_LOCKED_PECA: ${AZURE_CONTAINER_IMMUTABILITY_LOCKED_PECA:-}
      AZURE_CONTAINER_IMMUTABILITY_DAYS_PECA: ${AZURE_CONTAINER_IMMUTABILITY_DAYS_PECA:-}
      AZURE_CONTAINER_IMMUTABILITY_LOCKED_FBR: ${AZURE_CONTAINER_IMMUTABILITY_LOCKED_FBR:-}
      AZURE_CONTAINER_IMMUTABILITY_DAYS_FBR: ${AZURE_CONTAINER_IMMUTABILITY_DAYS_FBR:-}
      AZURE_CONTAINER_IMMUTABILITY_LOCKED_GENERAL: ${AZURE_CONTAINER_IMMUTABILITY_LOCKED_GENERAL:-}
      AZURE_CONTAINER_IMMUTABILITY_DAYS_GENERAL: ${AZURE_CONTAINER_IMMUTABILITY_DAYS_GENERAL:-}
      ARCHIVE_BATCH_SIZE: ${ARCHIVE_BATCH_SIZE:-5000}
      ARCHIVE_LEAD_DAYS: ${ARCHIVE_LEAD_DAYS:-1}
      ARCHIVE_INTERVAL_SECONDS: ${ARCHIVE_INTERVAL_SECONDS:-86400}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      warsoc-api:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
          pids: 256

  mongodb:
    image: mongo:7
    container_name: warsoc-mongo-prod
    restart: always
    logging: *warsoc-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD required}
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host 127.0.0.1 --port 27017
          -u "${MONGO_USER:?MONGO_USER required}"
          -p "${MONGO_PASSWORD:?MONGO_PASSWORD required}"
          --authenticationDatabase admin
          --quiet
          --eval 'db.adminCommand({ ping: 1 }).ok'
      interval: 10s
      timeout: 15s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: warsoc-redis-prod
    restart: always
    logging: *warsoc-logging
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-640mb} --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data_prod:/data
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: ${REDIS_CONTAINER_MEMORY_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  syslog-receiver:
    <<: *warsoc-process-security
    build: .
    container_name: warsoc-syslog-receiver-prod
    command: python /app/syslog_receiver.py
    profiles: ["network-syslog"]
    restart: always
    logging: *warsoc-logging
    env_file:
      - ${WARSOC_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      NETWORK_TENANT_ID: ${NETWORK_TENANT_ID:-WARSOC_NETWORK}
      SYSLOG_ALLOWED_SOURCES: ${SYSLOG_ALLOWED_SOURCES:-}
      SYSLOG_PORT: 5140
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      DB_NAME: ${MONGODB_DB_NAME:?MONGODB_DB_NAME required}
    ports:
      - "${SYSLOG_BIND:-127.0.0.1}:5140:5140/udp"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 256

  nginx:
    image: nginx:alpine
    container_name: warsoc-nginx-proxy
    restart: always
    logging: *warsoc-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      warsoc-internal:
        ipv4_address: 172.28.0.10
    depends_on:
      warsoc-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  mongo_data_prod:
  redis_data_prod:
  reports_data_prod:
  uploads_data_prod:

networks:
  warsoc-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
