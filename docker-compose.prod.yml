services:
  warsoc-api:
    build: .
    container_name: warsoc-api-prod
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: https://warsoc.tech
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      TRUSTED_PROXY_HOSTS: 172.28.0.10,127.0.0.1,::1,localhost
    volumes:
      - ./keys/public_key.pem:/app/keys/public_key.pem:ro
      - reports_data_prod:/app/app/data/reports:ro
      - uploads_data_prod:/app/uploaded_files
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      warsoc-internal:
        ipv4_address: 172.28.0.11
    # Notice: NO PORTS EXPOSED. Traffic must route through Nginx.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  warsoc-worker:
    build: .
    container_name: warsoc-worker-prod
    command: python -m app.workers.peca_worker
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    volumes:
      - ./keys:/app/keys:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker-siem:
    build: .
    container_name: warsoc-worker-siem-prod
    command: python -m app.workers.siem_worker
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    volumes:
      - ./keys:/app/keys:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker-fbr:
    build: .
    container_name: warsoc-worker-fbr-prod
    command: python -m app.workers.fbr_worker
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    volumes:
      - ./keys:/app/keys:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  threat-hunter:
    build: .
    container_name: warsoc-threat-hunter-prod
    command: python -m app.workers.detection_worker
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  compliance-cron:
    build: .
    container_name: warsoc-compliance-cron-prod
    command: python -m app.workers.compliance_cron
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - reports_data_prod:/app/app/data/reports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker-mail:
    build: .
    container_name: warsoc-worker-mail-prod
    command: python -m app.workers.mail_worker
    restart: always
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER required}:${MONGO_PASSWORD:?MONGO_PASSWORD required}@mongodb:27017/${MONGODB_DB_NAME:?MONGODB_DB_NAME required}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mongodb:
    image: mongo:6.0
    container_name: warsoc-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD required}
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: warsoc-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data_prod:/data
    networks:
      - warsoc-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: warsoc-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      warsoc-internal:
        ipv4_address: 172.28.0.10
    depends_on:
      warsoc-api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  mongo_data_prod:
  redis_data_prod:
  reports_data_prod:
  uploads_data_prod:

networks:
  warsoc-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

