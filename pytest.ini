[pytest]
asyncio_mode = auto
markers =
    backend: backend API and service contract checks
    hardening: deployment and security contract checks
    layer2: upload and parser integration checks
    layer3: SIEM ingestion and alert integration checks
    layer4: forensic and compliance integration checks
    layer5: retention integration checks
    layer6: WebSocket and notification integration checks
    layer7: frontend-facing API workflow checks
    chaos: controlled worker and persistence failure checks
