[pytest]
asyncio_mode = auto
addopts = -q
markers =
    layer1: Layer 1 auth tests
    layer2: Layer 2 upload and parsing tests
    layer3: Layer 3 SIEM integration tests
    layer4: Layer 4 forensics tests
    layer5: Layer 5 retention tests
    layer6: Layer 6 WebSocket tests
    layer7: Layer 7 frontend tests
    backend: Backend-only tests
    hardening: Deployment-readiness hardening tests
    chaos: Chaos and failure-mode tests
