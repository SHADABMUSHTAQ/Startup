version: '3.8'

services:
  # 🌐 WarSOC Unified Gateway (Sole Public Entry Point)
  nginx:
    build:
      context: ..
      dockerfile: Startup-backend/Dockerfile.nginx
    container_name: warsoc-gateway
    restart: always
    ports:
      - "80:80"
    networks:
      - warsoc-secure-net
    depends_on:
      - api

  # 🚀 WarSOC API Gateway (Internal)
  api:
    build: .
    container_name: warsoc-api
    restart: always
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://warsoc_admin:W4rS0c_M0ng0_S3cur3_2026!@mongodb:27017/WarSOC_DB?authSource=admin
      - REDIS_URL=redis://:W4rS0c_R3d1s_S3cur3_2026!@redis:6379
      - DB_NAME=WarSOC_DB
    networks:
      - warsoc-secure-net
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # 🍃 Core Database (PTA CTDISR-2025 Local Hosting Compliant)
  mongodb:
    image: mongo:6.0
    container_name: warsoc-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=warsoc_admin
      - MONGO_INITDB_ROOT_PASSWORD=W4rS0c_M0ng0_S3cur3_2026!
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"
    networks:
      - warsoc-secure-net

  # 💨 Stream Broker (Hardened)
  redis:
    image: redis:latest
    container_name: warsoc-redis
    command: redis-server --requirepass W4rS0c_R3d1s_S3cur3_2026!
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "W4rS0c_R3d1s_S3cur3_2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warsoc-secure-net

  # 📑 FBR Compliance Engine (SRO 288/69)
  worker-fbr:
    build: .
    container_name: warsoc-worker-fbr
    restart: always
    command: ["python", "-m", "app.workers.fbr_worker"]
    environment:
      - MONGODB_URI=mongodb://warsoc_admin:W4rS0c_M0ng0_S3cur3_2026!@mongodb:27017/WarSOC_DB?authSource=admin
      - REDIS_URL=redis://:W4rS0c_R3d1s_S3cur3_2026!@redis:6379
      - DB_NAME=WarSOC_DB
    networks:
      - warsoc-secure-net
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # 🔐 PECA Forensic Engine (Section 32/46)
  worker-peca:
    build: .
    container_name: warsoc-worker-peca
    restart: always
    command: ["python", "-m", "app.workers.peca_worker"]
    environment:
      - MONGODB_URI=mongodb://warsoc_admin:W4rS0c_M0ng0_S3cur3_2026!@mongodb:27017/WarSOC_DB?authSource=admin
      - REDIS_URL=redis://:W4rS0c_R3d1s_S3cur3_2026!@redis:6379
      - DB_NAME=WarSOC_DB
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - warsoc-secure-net
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # 🛡️ SIEM Security Engine
  worker-siem:
    build: .
    container_name: warsoc-worker-siem
    restart: always
    command: ["python", "-m", "app.workers.siem_worker"]
    environment:
      - MONGODB_URI=mongodb://warsoc_admin:W4rS0c_M0ng0_S3cur3_2026!@mongodb:27017/WarSOC_DB?authSource=admin
      - REDIS_URL=redis://:W4rS0c_R3d1s_S3cur3_2026!@redis:6379
      - DB_NAME=WarSOC_DB
    networks:
      - warsoc-secure-net
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

networks:
  warsoc-secure-net:
    driver: bridge
