services:
  # TIER 0: INFRASTRUCTURE

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: warsoc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - warsoc-secure-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 30s
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Stream Broker
  redis:
    image: redis:alpine
    container_name: warsoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks:
      warsoc-secure-net:
        aliases:
          - redis
          - warsoc-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TIER 2: APPLICATION

  # FastAPI Application Server
  api:
    build: .
    container_name: warsoc-api
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--workers", "1"]
    ports:
      - "8000:8000"
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
      - ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1,http://localhost
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - warsoc-secure-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TIER 3: UNIFIED WORKER & SYSLOG
  
  # UDP Syslog Receiver (For legacy firewall logs)
  syslog-receiver:
    build: .
    container_name: warsoc-syslog-receiver
    restart: unless-stopped
    command: ["python", "/app/syslog_receiver.py"]
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NETWORK_TENANT_ID=WARSOC_NETWORK
      - SYSLOG_PORT=5140
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - DB_NAME=${MONGODB_DB_NAME}
    ports:
      - "127.0.0.1:5140:5140/udp"
    networks:
      - warsoc-secure-net
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    memswap_limit: 100M
    deploy:
      resources:
        limits:
          memory: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Combines SIEM, FBR, and PECA streams into a single async event loop to save memory.
  unified-worker:
    build: .
    container_name: warsoc-unified-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.unified_worker"]
    env_file:
      - ${WARSOC_ENV_FILE:-.env}
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
      - CONSUMER_NAME=unified_worker_1
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - warsoc-secure-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    memswap_limit: 300M
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



networks:
  warsoc-secure-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
