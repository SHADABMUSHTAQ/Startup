services:
  # 🌐 WarSOC Unified Gateway (Sole Public Entry Point)
  nginx:
    build:
      context: ..
      dockerfile: Startup-backend/Dockerfile.nginx
    container_name: warsoc-gateway
    restart: always
    ports:
      - "80:80"
    networks:
      - warsoc-secure-net
    depends_on:
      - api

  # 🚀 WarSOC API Gateway (Internal)
  api:
    build: .
    container_name: warsoc-api
    restart: always
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
      - ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1,http://localhost
    networks:
      - warsoc-secure-net
    depends_on:
      - mongodb
      - redis

  # 🍃 Core Database (PTA CTDISR-2025 Local Hosting Compliant)
  mongodb:
    image: mongo:6.0
    container_name: warsoc-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=warsoc_admin
      - MONGO_INITDB_ROOT_PASSWORD=W4rS0c_M0ng0_S3cur3_2026!
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"
    networks:
      - warsoc-secure-net

  # 💨 Stream Broker (Hardened)
  redis:
    image: redis:latest
    container_name: warsoc-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      warsoc-secure-net:
        aliases:
          - redis
          - warsoc-redis

  # 📑 FBR Compliance Engine (SRO 288/69)
  worker-fbr:
    build: .
    container_name: warsoc-worker-fbr
    restart: always
    command: ["python", "-m", "app.workers.fbr_worker"]
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - warsoc-secure-net
    depends_on:
      - mongodb
      - redis

  # 🔐 PECA Forensic Engine (Section 32/46)
  worker-peca:
    build: .
    container_name: warsoc-worker-peca
    restart: always
    command: ["python", "-m", "app.workers.peca_worker"]
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - warsoc-secure-net
    depends_on:
      - mongodb
      - redis

  # 🛡️ SIEM Security Engine
  worker-siem:
    build: .
    container_name: warsoc-worker-siem
    restart: always
    command: ["python", "-m", "app.workers.siem_worker"]
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DB_NAME=${MONGODB_DB_NAME}
    networks:
      - warsoc-secure-net
    depends_on:
      - mongodb
      - redis

  # Frontend is served via the nginx gateway (production build)
networks:
  warsoc-secure-net:
    driver: bridge
